name: Build Ajax Tactics APK

on:
  push:
    branches: [ ajax-tactics-manager ]
    paths:
      - 'ajax-tactics/**'
      - '.github/workflows/ajax-tactics.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: ajax-tactics
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ajax-Tactics-Manager-APK
          path: ajax-tactics/app/build/outputs/apk/debug/app-debug.apk
